plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

neoForge {
    version = neo_version

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }

        client {
            client()
            jvmArguments.addAll '-Xmx4G', '-Xms2G'
        }

        server {
            server()
            programArguments.addAll '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Patchouli — disabled until a 1.21.11 build is available
    // compileOnly "vazkii.patchouli:Patchouli:1.21.11-NEOFORGE:api"
    // localRuntime "vazkii.patchouli:Patchouli:1.21.11-NEOFORGE"

    // JEI — disabled until a 1.21.11 build is available
    // compileOnly "mezz.jei:jei-1.21.11-common-api:..."
    // compileOnly "mezz.jei:jei-1.21.11-neoforge-api:..."
    // localRuntime "mezz.jei:jei-1.21.11-neoforge:..."
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// idea plugin: sources/javadoc downloads are configured via IDE settings

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xmaxerrs', '500']
}
