plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

neoForge {
    version = neo_version

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'info'
        }

        client {
            client()
            jvmArguments.addAll '-Xmx6G', '-Xms512M'
        }

        server {
            server()
            programArguments.addAll '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'
        }

        data {
            // NeoForge 21.11 / MDG split GatherDataEvent into clientData + serverData. The Witchery
            // datagen (Modonomicon book) registers on GatherDataEvent.Client, so it runs here.
            clientData()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // Plain-JVM unit tests with the game registries bootstrapped (no client/server launch).
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    // Modonomicon (in-game guidebook library) is published to klikli-dev's Cloudsmith maven.
    maven {
        name = 'Klikli Cloudsmith'
        url = 'https://dl.cloudsmith.io/public/klikli-dev/mods/maven/'
    }

    // CurseMaven — pulls CurseForge mod jars by project/file id. Used for dev-only tool mods.
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    // Modonomicon — backs the Witches' Primer guidebook. Compile-time (datagen + open-book API)
    // and runtime (hard dependency). transitive=false: it only needs NeoForge, already on the
    // classpath. Coordinate is assembled from minecraft_version + modonomicon_version.
    implementation("com.klikli_dev:modonomicon-${minecraft_version}-neoforge:${modonomicon_version}") {
        transitive = false
    }

    // Patchouli — superseded by Modonomicon; left here for reference. The legacy
    // assets/witchery/patchouli_books/ content is kept until the Modonomicon migration is verified.
    // compileOnly "vazkii.patchouli:Patchouli:1.21.11-NEOFORGE:api"
    // localRuntime "vazkii.patchouli:Patchouli:1.21.11-NEOFORGE"

    // JEI — disabled until a 1.21.11 build is available
    // compileOnly "mezz.jei:jei-1.21.11-common-api:..."
    // compileOnly "mezz.jei:jei-1.21.11-neoforge-api:..."
    // localRuntime "mezz.jei:jei-1.21.11-neoforge:..."

    // WorldEdit — dev-only world-building tool for the designer. Dev runtime only via
    // localRuntime (chained into runtimeClasspath at the top of this file); never shipped
    // with Witchery. CurseForge release for MC 1.21.11 / NeoForge: 7.4.2 (project 225608,
    // file 7855515). transitive=false: the CurseForge jar is fully bundled.
    localRuntime("curse.maven:worldedit-225608:7855515") {
        transitive = false
    }

    testImplementation platform("org.junit:junit-bom:5.11.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = file('repo').toURI()
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// idea plugin: sources/javadoc downloads are configured via IDE settings

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xmaxerrs', '500']
}
